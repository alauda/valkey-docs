name: Update sites.yaml version on branch creation

# Kept in the shape redis-docs uses. The create event applies no branch
# filter of its own, so the job condition below is what selects release
# branches.
on:
  create:
    branches:
      - 'release-*'

permissions:
  contents: write

jobs:
  update-sites:
    if: startsWith(github.ref_name, 'release-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from branch name
        id: extract_version
        env:
          # Read through the environment, never through template interpolation:
          # a branch name is user-supplied text that must not reach the shell
          # as code.
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$BRANCH_NAME" =~ ^release-([0-9]+\.[0-9]+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "Branch '$BRANCH_NAME' is not release-<major>.<minor>; leaving sites.yaml unchanged."
          fi

      - name: Update sites.yaml
        if: steps.extract_version.outputs.version != ''
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          echo "Setting version to $VERSION"
          sed -i -E "s/(version:).*/\1 \"$VERSION\"/" sites.yaml

      - name: Commit changes
        if: steps.extract_version.outputs.version != ''
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sites.yaml
          git commit -m "Update sites.yaml version to $VERSION" || echo "No changes to commit"

      - name: Push changes
        if: steps.extract_version.outputs.version != ''
        run: |
          git push origin HEAD:"$GITHUB_REF_NAME"
